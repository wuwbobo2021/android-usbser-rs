[package]
name = "android-usb-cdc-test"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
log = "0.4"
serialport = "4.9"
nusb = { git = "https://github.com/uglyoldbob/nusb.git", rev = "694ed76" }
android_logger = "0.15"
android-activity = { version = "0.6.1", features = ["native-activity"] }
android-usbser = { path = "../android-usbser" }

[lib]
name = "android_usb_cdc_test"
crate-type = ["cdylib"]
path = "lib.rs"

[package.metadata.android]
package = "com.example.android_usb_cdc_test"
build_targets = [ "aarch64-linux-android" ]
resources = "./res"

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 36

[[package.metadata.android.uses_feature]]
name = "android.hardware.usb.host"
required = true

# these are for `cargo-apk2`
# [package.metadata.android.application]
# has_code = false
#
# [[package.metadata.android.application.activity]]
# name = "android.app.NativeActivity"
#
# [[package.metadata.android.application.activity.intent_filter]]
# actions = ["android.intent.action.VIEW", "android.intent.action.MAIN"]
# categories = ["android.intent.category.LAUNCHER"]
#
# [[package.metadata.android.application.activity.meta_data]]
# name = "android.app.lib_name"
# value = "android_usb_cdc_test"

