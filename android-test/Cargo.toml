[package]
name = "android-usb-cdc-test"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
log = "0.4"
serialport = "4.7"
nusb = { git = "https://github.com/wuwbobo2021/nusb.git", rev = "f4ff489" }
android_logger = "0.15"
android-activity = { version = "0.6", features = ["native-activity"] }
android-usbser = { path = "../android-usbser" }

[lib]
name = "android_usb_cdc_test"
crate-type = ["cdylib"]
path = "lib.rs"

[package.metadata.android]
package = "com.example.android_usb_cdc_test"
# for cargo-apk2: build_targets = [ "Arm64V8a" ]
build_targets = [ "aarch64-linux-android" ]
resources = "./res"

[package.metadata.android.sdk]
min_sdk_version = 16
target_sdk_version = 30

[[package.metadata.android.uses_feature]]
name = "android.hardware.usb.host"
required = true

# these are for `cargo-apk2`
# [package.metadata.android.application]
# has_code = false
#
# [[package.metadata.android.application.activity]]
# name = "android.app.NativeActivity"
#
# [[package.metadata.android.application.activity.intent_filter]]
# actions = ["android.intent.action.VIEW", "android.intent.action.MAIN"]
# categories = ["android.intent.category.LAUNCHER"]
#
# [[package.metadata.android.application.activity.meta_data]]
# name = "android.app.lib_name"
# value = "android_usb_cdc_test"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.hardware.usb.action.USB_DEVICE_ATTACHED"]

# Please check <https://github.com/rust-mobile/cargo-apk/pull/67> or just use `cargo-apk2`.
# Otherwise comment out the lines below (request for permission purely at runtime).
[[package.metadata.android.application.activity.meta_data]]
name = "android.hardware.usb.action.USB_DEVICE_ATTACHED"
resource = "@xml/device_filter"
